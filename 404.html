<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1A2E40" />
<title>Sayfa Bulunamadı — Harmony</title>
<meta name="description" content="Aradığınız sayfa bulunamadı. Harmony ana sayfasına dönebilirsiniz." />
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="brand/harmony-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          clay: {
            50: '#fdf5f0',
            100: '#fae6d9',
            200: '#f3c8ab',
            300: '#eba576',
            400: '#e28449',
            500: '#d1652c',
            600: '#b04f20',
            700: '#8c3e1c',
          },
          ink: {
            50: '#f4f5f6',
            100: '#e4e6e9',
            200: '#c3c8cf',
            300: '#9aa2ad',
            400: '#6b7480',
            500: '#4c5561',
            600: '#3a414c',
            700: '#2b303a',
            800: '#1d2129',
            900: '#14171d',
          },
        },
        fontFamily: {
          display: ['"Fraunces"', 'serif'],
          sans: ['"Manrope"', 'sans-serif'],
        },
        boxShadow: {
          'lifted': '0 20px 40px -12px rgba(224,109,83,0.28), 0 8px 16px -8px rgba(28,22,15,0.12)',
        },
      },
    },
  };
</script>
<style>
  body { font-family: 'Manrope', sans-serif; }
  .font-display { font-family: 'Fraunces', serif; }
  .cta-btn {
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .cta-btn:hover {
    transform: translateY(-2px);
  }
  .cta-btn:active {
    transform: translateY(0px) scale(0.98);
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  .signpost {
    animation: float 6s ease-in-out infinite;
  }
</style>
</head>
<body class="bg-[#f8fafc] text-ink-800 antialiased">

<main class="relative flex min-h-screen flex-col items-center justify-center overflow-hidden px-4 text-center">

  <!-- Massive background 404 -->
  <p class="pointer-events-none absolute inset-0 top-1/2 -translate-y-1/2 select-none font-display text-[9rem] font-bold leading-none text-[#1A2E40]/10 sm:text-[14rem]" aria-hidden="true">
    404
  </p>

  <div class="relative z-10 flex flex-col items-center">

    <!-- Dead-end street illustration -->
    <div class="signpost mb-8 flex h-28 w-28 items-center justify-center rounded-full bg-clay-50 shadow-lifted sm:h-32 sm:w-32">
      <svg width="60" height="60" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- sign post -->
        <line x1="32" y1="60" x2="32" y2="36" stroke="#b04f20" stroke-width="2.5" stroke-linecap="round"/>
        <!-- sign plate -->
        <rect x="8" y="8" width="48" height="30" rx="4" fill="#fdf5f0" stroke="#d1652c" stroke-width="2.5"/>
        <!-- dead-end (T-junction) symbol -->
        <path d="M32 32V18M18 18h28" stroke="#d1652c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <h1 class="mb-4 font-display text-3xl font-bold text-[#1A2E40] md:text-4xl">
      Bu sokak çıkmaz sokak...
    </h1>
    <p class="mx-auto mb-8 max-w-md text-lg leading-relaxed text-ink-500">
      Ama şehri baştan tasarlamak için ana sayfaya dönebilirsiniz.
    </p>

    <a href="index.html" class="cta-btn inline-flex items-center gap-2 rounded-full bg-[#E06D53] px-7 py-3.5 text-sm font-semibold text-white shadow-lifted transition-colors duration-200 hover:bg-clay-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-clay-600">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/></svg>
      Ana Sayfaya Dön
    </a>

  </div>
</main>

</body>
</html>
